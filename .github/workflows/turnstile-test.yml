name: turnstile-test

# Trial #3 (user 2026-11-12): chirag127/turnstile-auto-bypass userscript.
# Dispatch-only, bukan cron. Adaptasi: GM shims + context.add_init_script
# (jalan di SEMUA frame termasuk challenges.cloudflare.com).
# Verdict: token cf-turnstile-response non-kosong = PASS.

on:
  workflow_dispatch:

jobs:
  tsb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install playwright + chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch userscript
        run: |
          curl -sL --retry 3 \
            https://raw.githubusercontent.com/chirag127/turnstile-auto-bypass/main/turnstile-auto-bypass.user.js \
            -o tsb.user.js
          wc -c tsb.user.js
          head -3 tsb.user.js

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 1
          echo "DISPLAY=:99"

      - name: Run trial (clipcoin real sitekey)
        env:
          PYTHONUNBUFFERED: "1"
          DISPLAY: ":99"
        run: |
          python - <<'PY'
          import re, time, pathlib
          from playwright.sync_api import sync_playwright

          src = pathlib.Path("tsb.user.js").read_text()
          src = re.sub(r"// ==UserScript==.*?// ==/UserScript==", "", src, flags=re.S)

          shim = """
          window.GM_getValue = function(k, d){ try { var v = localStorage.getItem('gm:'+k); return v===null?d:JSON.parse(v); } catch(e){ return d; } };
          window.GM_setValue = function(k,v){ try { localStorage.setItem('gm:'+k, JSON.stringify(v)); } catch(e){} };
          window.GM_log = function(){};
          window.GM_registerMenuCommand = function(){};
          window.CAT_registerMenuInput = function(){};
          """
          script = shim + src
          print("script bytes:", len(script))

          UA = ("Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120 Mobile Safari/537.36")

          with sync_playwright() as p:
              b = p.chromium.launch(
                  headless=False,
                  args=["--no-sandbox", "--disable-blink-features=AutomationControlled"],
              )
              ctx = b.new_context(
                  user_agent=UA, locale="en-US",
                  viewport={"width": 412, "height": 915},
              )
              ctx.add_init_script(script)   # semua frame, sebelum page scripts
              page = ctx.new_page()
              page.on("pageerror", lambda e: print("PAGEERROR:", str(e)[:300]))
              page.on("console", lambda m: print("CONSOLE:", m.type, m.text[:200])
                      if m.type in ("error", "warning") else None)

              page.goto("https://clipcoin.pro/signin",
                        wait_until="domcontentloaded", timeout=60000)

              token = ""
              for i in range(60):  # ~90 dtk
                  try:
                      token = page.evaluate(
                          """() => { const el = document.querySelector(
                             'input[name="cf-turnstile-response"]');
                             return el ? el.value : ""; }"""
                      )
                  except Exception as e:
                      print("eval err:", str(e)[:150])
                      token = ""
                  if token:
                      break
                  time.sleep(1.5)

              try:
                  ifr = page.evaluate(
                      """() => document.querySelectorAll(
                         'iframe[src*="challenges.cloudflare.com"]').length"""
                  )
                  print("CF_IFRAMES:", ifr)
              except Exception:
                  pass
              try:
                  print("TITLE:", page.title())
              except Exception:
                  pass

              print("TOKEN_LEN:", len(token))
              if token:
                  print("TOKEN_HEAD:", token[:60])
                  print("VERDICT: PASS")
              else:
                  print("VERDICT: FAIL")
              b.close()
          PY

      - name: Dump playwright log
        if: always()
        run: echo "trial selesai"
