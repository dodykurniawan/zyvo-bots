name: bots

on:
  schedule:
    # tiap 6 jam (menit 17 — hindari padatnya menit-00)
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Tes singkat (--once lalu keluar)'
        type: boolean
        default: false
      only:
        description: 'Jalankan bot mana saja'
        type: choice
        default: all
        options:
          - all
          - cf
          - ctd
          - lm
          - lime

# CONCURRENCY per-job (BUKAN workflow-level): di level workflow
# `github.job` kosong → group "bots-" → SEMUA run antri penuh.
# Tiap job punya group sendiri supaya cf/ctd/lm paralel lintas run,
# tapi job sama tidak dobel.
jobs:
  cf:
    if: inputs.only == 'all' || inputs.only == 'cf' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: bots-cf
      cancel-in-progress: false
    # batas GitHub = 360 mnt; kita stop di 340 biar sempat cleanup
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -q requests

      - name: Tulis config dari Secrets
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = {
              "email": os.environ.get("CF_EMAIL", ""),
              "coin": "BTC",
              "wd_gateway": "faucetpay",
              "wd_address": "dodykurniaw4n@gmail.com",
              "wd_currency": "USDT",
              "wd_min_usd": 0.001,
              "hold_wd_until_upgrade": False,
              "hold_usdt_for_upgrade": True,
              "auto_wd": True,
          }
          os.makedirs("cryptofisher", exist_ok=True)
          with open("cryptofisher/cf_config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          print("cf_config.json siap (password TIDAK ditulis ke file)")
          PY

      - name: Self-heal CF (relogin kalau sesi mati)
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: python3 -u scripts/selfheal.py --only cf || true

      - name: Jalankan CF premium (level + auto WD)
        id: bot
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        working-directory: cryptofisher
        run: |
          set +e
          ARGS=""
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="--once"; fi
          run_bot() {
            # SIGINT → KeyboardInterrupt → cleanup rapi; 340 mnt < batas 360
            # tanpa --ptc: PTC curi waktu mancing (fokus level)
            timeout -s INT -k 60 340m python3 -u cryptofisher_premium.py --wd-every 15 $ARGS
          }
          run_bot
          ec=$?
          echo "exit=$ec"
          # 124/130 = timeout/signal — bukan error bot
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 124 ] || [ "$ec" -eq 130 ]; then exit 0; fi
          # retry 1x setelah self-heal (sesi/error sementara)
          echo "retry setelah self-heal…"
          python3 -u ../scripts/selfheal.py --only cf || true
          run_bot
          ec=$?
          echo "exit_retry=$ec"
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 124 ] || [ "$ec" -eq 130 ]; then exit 0; fi
          exit $ec

      - name: Notifikasi Telegram (CF)
        if: always() && steps.bot.outcome != 'skipped'
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "TG belum diset"; exit 0; }
          if [ "${{ steps.bot.outcome }}" = "success" ]; then ST="✅ SUKSES"; else ST="❌ GAGAL"; fi
          BAL=$(python3 scripts/balance_all.py 2>/dev/null | head -3 || true)
          TEXT="🤖 CF Premium (level+WD) — $ST
          $BAL
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=$TEXT"

  ctd:
    if: inputs.only == 'all' || inputs.only == 'ctd' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: bots-ctd
      cancel-in-progress: false
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: pip install -q requests

      - name: Tulis config dari Secrets
        env:
          CTD_EMAIL: ${{ secrets.CTD_EMAIL }}
          CTD_PASSWORD: ${{ secrets.CTD_PASSWORD }}
          CTD_COOKIE: ${{ secrets.CTD_COOKIE }}
          LM_CONFIG_JSON: ${{ secrets.LM_CONFIG_JSON }}
        run: |
          mkdir -p lightningminer cryptotowerdefense
          printf '%s' "$LM_CONFIG_JSON" > lightningminer/lm_config.json
          # cookie sesi lama — kalau masih valid, TIDAK perlu login Turnstile
          printf '%s' "$CTD_COOKIE" > cryptotowerdefense/ctd_cookie.txt
          printf '%s' "$CTD_EMAIL" > cryptotowerdefense/ctd_email.txt
          printf '%s' "$CTD_PASSWORD" > cryptotowerdefense/ctd_secret.txt
          python3 - <<'PY'
          import json
          p = "lightningminer/lm_config.json"
          c = json.load(open(p))
          # solver lokal 127.0.0.1 tidak ada di Actions — buang biar cepat
          c.pop("local_ts_url", None)
          c.pop("local_hc_url", None)
          json.dump(c, open(p, "w"), indent=2)
          print("lm_config.json siap untuk CTD (xsolve/peak key)")
          ck = open("cryptotowerdefense/ctd_cookie.txt").read().strip()
          print("ctd_cookie.txt siap,", len(ck), "chars")
          PY

      - name: Self-heal CTD (relogin kalau cookie mati)
        env:
          CTD_EMAIL: ${{ secrets.CTD_EMAIL }}
          CTD_PASSWORD: ${{ secrets.CTD_PASSWORD }}
          LM_CONFIG_PATH: ${{ github.workspace }}/lightningminer/lm_config.json
        run: python3 -u scripts/selfheal.py --only ctd || true

      - name: Jalankan CTD
        id: bot
        env:
          CTD_EMAIL: ${{ secrets.CTD_EMAIL }}
          CTD_PASSWORD: ${{ secrets.CTD_PASSWORD }}
          LM_CONFIG_PATH: ${{ github.workspace }}/lightningminer/lm_config.json
        working-directory: cryptotowerdefense
        run: |
          set +e
          ARGS=""
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="--once"; fi
          run_bot() {
            timeout -s INT -k 60 340m python3 -u ctd_auto.py $ARGS
          }
          run_bot
          ec=$?
          echo "exit=$ec"
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 124 ] || [ "$ec" -eq 130 ]; then
            pkill -f ctd_run_bot.mjs 2>/dev/null || true
            exit 0
          fi
          echo "retry setelah self-heal…"
          python3 -u ../scripts/selfheal.py --only ctd || true
          run_bot
          ec=$?
          echo "exit_retry=$ec"
          pkill -f ctd_run_bot.mjs 2>/dev/null || true
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 124 ] || [ "$ec" -eq 130 ]; then exit 0; fi
          exit $ec

      - name: Notifikasi Telegram (CTD)
        if: always() && steps.bot.outcome != 'skipped'
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "TG belum diset"; exit 0; }
          if [ "${{ steps.bot.outcome }}" = "success" ]; then ST="✅ SUKSES"; else ST="❌ GAGAL"; fi
          BAL=$(python3 scripts/balance_all.py 2>/dev/null | head -3 || true)
          TEXT="🛡️ CryptoTowerDefense — $ST
          $BAL
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=$TEXT"

  lm:
    if: inputs.only == 'all' || inputs.only == 'lm' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: bots-lm
      cancel-in-progress: false
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # Pillow = PIL (shortlink Xut baca gambar captcha)
        run: pip install -q requests pillow

      - name: Tulis config dari Secrets
        env:
          LM_CONFIG_JSON: ${{ secrets.LM_CONFIG_JSON }}
        run: |
          mkdir -p lightningminer
          printf '%s' "$LM_CONFIG_JSON" > lightningminer/lm_config.json
          python3 - <<'PY'
          import json
          p = "lightningminer/lm_config.json"
          c = json.load(open(p))
          c.pop("local_ts_url", None)
          c.pop("local_hc_url", None)
          json.dump(c, open(p, "w"), indent=2)
          print("lm_config.json siap untuk LM")
          PY

      - name: Self-heal LM (relogin kalau sesi mati)
        env:
          LM_CONFIG_PATH: ${{ github.workspace }}/lightningminer/lm_config.json
        run: python3 -u scripts/selfheal.py --only lm || true

      - name: Jalankan LightningMiner
        id: bot
        env:
          LM_CONFIG_PATH: ${{ github.workspace }}/lightningminer/lm_config.json
        working-directory: lightningminer
        run: |
          set +e
          ARGS=""
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="--once"; fi
          run_bot() {
            timeout -s INT -k 60 340m python3 -u lightningminer_auto.py --interval 180 $ARGS
          }
          run_bot
          ec=$?
          echo "exit=$ec"
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 124 ] || [ "$ec" -eq 130 ]; then exit 0; fi
          echo "retry setelah self-heal…"
          python3 -u ../scripts/selfheal.py --only lm || true
          run_bot
          ec=$?
          echo "exit_retry=$ec"
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 124 ] || [ "$ec" -eq 130 ]; then exit 0; fi
          exit $ec

      - name: Notifikasi Telegram (LM)
        if: always() && steps.bot.outcome != 'skipped'
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "TG belum diset"; exit 0; }
          if [ "${{ steps.bot.outcome }}" = "success" ]; then ST="✅ SUKSES"; else ST="❌ GAGAL"; fi
          BAL=$(python3 scripts/balance_all.py 2>/dev/null | head -3 || true)
          TEXT="⛏️ LightningMiner — $ST
          $BAL
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=$TEXT"

  lime:
    # limefaucet nolak IP datacenter GitHub (403 VPN/Proxy detected).
    # Jadwal TIDAK jalan lime — hanya manual (butuh proxy/residential IP).
    if: github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'lime')
    runs-on: ubuntu-latest
    concurrency:
      group: bots-lime
      cancel-in-progress: false
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # Pillow+numpy = captcha rotasi lokal (gratis)
        run: pip install -q requests pillow numpy

      - name: Tulis config dari Secrets
        env:
          LIME_EMAIL: ${{ secrets.LIME_EMAIL }}
          CAPTCHA_APIKEY: ${{ secrets.CAPTCHA_APIKEY }}
        run: |
          mkdir -p limefaucet
          python3 - <<'PY'
          import os
          email = os.environ.get("LIME_EMAIL", "")
          key = os.environ.get("CAPTCHA_APIKEY", "")
          lines = [
              f"LIME_EMAIL={email}",
              f"CAPTCHA_APIKEY={key}",
              "TOKEN_BUDGET=0",
              "TOKEN_RESERVE=100",
              "TOKEN_PRICE=0",
              "YOUTUBE_MAX=10",
          ]
          open("limefaucet/config.env", "w").write("\n".join(lines) + "\n")
          print("lime config siap; captcha_key:", "ADA" if key else "KOSONG (faucet+YT saja)")
          PY

      - name: Self-heal Lime (relogin kalau sesi mati)
        env:
          LIME_EMAIL: ${{ secrets.LIME_EMAIL }}
        run: |
          # sesi IP-terikat di Actions selalu baru → hapus cookie lama
          rm -f limefaucet/.lime_session.json
          echo "cookie dibuang (runner IP baru, login otomatis saat run)"

      - name: Jalankan LimeFaucet
        id: bot
        env:
          LIME_EMAIL: ${{ secrets.LIME_EMAIL }}
          CAPTCHA_APIKEY: ${{ secrets.CAPTCHA_APIKEY }}
        working-directory: limefaucet
        run: |
          set +e
          ARGS=""
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="--once"; fi
          run_bot() {
            timeout -s INT -k 60 340m python3 -u limefaucet_auto.py \
              --youtube-max 10 --youtube-interval 600 $ARGS
          }
          run_bot
          ec=$?
          echo "exit=$ec"
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 124 ] || [ "$ec" -eq 130 ]; then exit 0; fi
          echo "retry setelah buang sesi…"
          rm -f .lime_session.json
          run_bot
          ec=$?
          echo "exit_retry=$ec"
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 124 ] || [ "$ec" -eq 130 ]; then exit 0; fi
          exit $ec

      - name: Notifikasi Telegram (Lime)
        if: always() && steps.bot.outcome != 'skipped'
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "TG belum diset"; exit 0; }
          if [ "${{ steps.bot.outcome }}" = "success" ]; then ST="✅ SUKSES"; else ST="❌ GAGAL"; fi
          TEXT="🍋 LimeFaucet — $ST
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=$TEXT"

  # Ringkasan 1 pesan per run — jalan walau ada job gagal/skip
  notify:
    needs: [cf, ctd, lm, lime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps + config balance
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CTD_COOKIE: ${{ secrets.CTD_COOKIE }}
          LM_CONFIG_JSON: ${{ secrets.LM_CONFIG_JSON }}
        run: |
          pip install -q requests
          mkdir -p cryptofisher cryptotowerdefense lightningminer
          python3 - <<'PY'
          import json, os
          cfg = {
              "email": os.environ.get("CF_EMAIL", ""),
              "coin": "BTC", "wd_gateway": "faucetpay",
              "wd_address": "dodykurniaw4n@gmail.com",
              "wd_currency": "USDT", "wd_min_usd": 0.001,
              "hold_wd_until_upgrade": False,
          }
          json.dump(cfg, open("cryptofisher/cf_config.json", "w"), indent=2)
          open("cryptotowerdefense/ctd_cookie.txt", "w").write(
              os.environ.get("CTD_COOKIE", ""))
          c = json.loads(os.environ.get("LM_CONFIG_JSON") or "{}")
          c.pop("local_ts_url", None); c.pop("local_hc_url", None)
          json.dump(c, open("lightningminer/lm_config.json", "w"), indent=2)
          print("config notify siap")
          PY

      - name: Kirim ringkasan ke Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          R_CF: ${{ needs.cf.result }}
          R_CTD: ${{ needs.ctd.result }}
          R_LM: ${{ needs.lm.result }}
          R_LIME: ${{ needs.lime.result }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "TG belum diset"; exit 0; }
          badge() {
            case "$1" in
              success)  echo "✅ sukses" ;;
              failure)  echo "❌ gagal" ;;
              cancelled) echo "⛔ dibatalkan" ;;
              skipped)  echo "⏭️ dilewati" ;;
              *)        echo "❓ $1" ;;
            esac
          }
          ALL_OK=1
          for r in "$R_CF" "$R_CTD" "$R_LM" "$R_LIME"; do
            [ "$r" = "failure" ] || [ "$r" = "cancelled" ] && ALL_OK=0
          done
          if [ "$ALL_OK" = "1" ] && [ "$R_CF" != "skipped" -o "$R_CTD" != "skipped" -o "$R_LM" != "skipped" -o "$R_LIME" != "skipped" ]; then
            HEAD="📊 Ringkasan zyvo-bots — AMAN"
          else
            HEAD="📊 Ringkasan zyvo-bots — ADA MASALAH"
          fi
          BAL=$(python3 scripts/balance_all.py 2>/dev/null || true)
          TEXT="$HEAD
          🎣 CF: $(badge "$R_CF")
          🛡️ CTD: $(badge "$R_CTD")
          ⛏️ LM: $(badge "$R_LM")
          🍋 Lime: $(badge "$R_LIME")
          $BAL
          🕐 $(date -u '+%Y-%m-%d %H:%M UTC')
          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=$TEXT"
