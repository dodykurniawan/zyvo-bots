# Trial EzSolver (2026-11-12) — solver Turnstile lokal GRATIS (Chrome+nodriver).
# Keputusan user: coba EzSolver dulu; kalau GAGAL → revert xsolve seperti awal.
# Verdict: PASS = token clipcoin sitekey asli keluar (bukan hanya demo).
# Dispatch-only, bukan cron — jangan dijadwalkan.
name: ezsolver-test

on:
  workflow_dispatch:

jobs:
  ezsolver-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # python3.14 bawaan image gagal connect CDP (run 43217342722) → pin 3.12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (xvfb + nodriver + chrome check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --quiet nodriver
          echo "CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)" >> "$GITHUB_ENV"
          echo "chrome at: $(command -v google-chrome || echo NOT-FOUND)"
          python --version
          google-chrome --version

      - name: Debug — chrome standalone launch
        run: |
          # buktiin chrome sendiri bisa jalan di runner ini (bukan salah EzSolver)
          timeout 25 google-chrome --headless=new --no-sandbox --disable-gpu \
            --user-data-dir=/tmp/chrome-dbg --dump-dom about:blank \
            && echo "CHROME-STANDALONE-OK" || echo "CHROME-STANDALONE-FAIL rc=$?"

      - name: Clone EzSolver
        run: git clone --depth 1 https://github.com/ismoiloffS/EzSolver.git /tmp/ezsolver

      - name: Start service (persistent Chrome)
        run: |
          cd /tmp/ezsolver
          # Chrome connect flaky di runner (run 1+4 gagal, 2+3 OK) → retry 3x
          for try in 1 2 3; do
            PYTHONUNBUFFERED=1 nohup python3 -u service.py > /tmp/ezsolver-service.log 2>&1 &
            echo "service try $try pid $!"
            for i in $(seq 1 20); do
              curl -sf http://127.0.0.1:8191/health >/dev/null 2>&1 && { echo "healthy try $try/$i"; exit 0; }
              # service mati (traceback connect gagal) → stop percobaan awal, restart
              pgrep -f "python3 -u service.py" >/dev/null || break
              sleep 2
            done
            pkill -f "python3 -u service.py" 2>/dev/null || true
            sleep 3
          done
          echo "SERVICE NOT HEALTHY after 3 tries"
          tail -30 /tmp/ezsolver-service.log
          exit 1

      - name: Probe IP + scrape LM sitekey
        id: probe
        run: |
          # IP runner kena block CF? (status/header dari 2 target)
          echo "--- clipcoin.pro/signin ---"
          curl -sI -m 15 -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36" \
            https://clipcoin.pro/signin | head -12
          echo "--- lightningminer.com ---"
          curl -sI -m 15 -A "Mozilla/5.0" https://lightningminer.com/ | head -8
          echo "--- api.js turnstile (asset kunci widget) ---"
          curl -sI -m 15 "https://challenges.cloudflare.com/turnstile/v0/api.js" | head -8
          # sitekey LM asli dari homepage (regex sama dgn bot)
          SK=$(curl -s -m 20 -A "Mozilla/5.0 (Linux; Android 13) Chrome/120 Mobile Safari/537.36" https://lightningminer.com/ \
            | grep -oE '0x4AAAAAA[A-Za-z0-9_-]+' | head -1 || true)
          echo "LM sitekey scraped: ${SK:-NONE}"
          echo "lm_sitekey=$SK" >> "$GITHUB_OUTPUT"

      # DIAGNOSA GROUND-TRUTH (run 3: iframe tak pernah ada, semua klik fallback).
      # Jawab: api.js load? turnstile global ada? iframe masuk DOM? box ada?
      - name: Browser probe — widget ground truth
        env:
          # Xvfb :99 di-start proses service; step ini harus pinjam display-nya
          # (run 5: probe gagal "Failed to connect" karena DISPLAY kosong)
          DISPLAY: ":99"
        run: |
          python3 - <<'EOF'
          import asyncio, json, nodriver as uc

          INJECT = """
          (() => {
              window.stop();
              document.body.innerHTML = '';
              window._tsToken = null;
              window._tsError = null;
              const origAttach = Element.prototype.attachShadow;
              Element.prototype.attachShadow = function(init) {
                  const root = origAttach.call(this, { ...init, mode: 'open' });
                  window._tsShadowRoot = root;
                  return root;
              };
              const wrap = document.createElement('div');
              wrap.id = '_ts_box';
              wrap.style = 'position:fixed;top:20px;left:20px;z-index:2147483647;';
              document.body.appendChild(wrap);
              window._tsLoad = function () { window._tsLoaded = true;
                  try { turnstile.render('#_ts_box', {
                      sitekey: '0x4AAAAAAF2fs7K06aFo4dK_',
                      callback: function(token) { window._tsToken = token; },
                      'error-callback': function(code) { window._tsError = String(code); }
                  }); window._tsRenderCalled = true; }
                  catch (e) { window._tsRenderErr = String(e); }
              };
              const s = document.createElement('script');
              s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=_tsLoad&render=explicit';
              s.async = true;
              s.onerror = function() { window._tsScriptErr = 'api.js onerror'; };
              document.head.appendChild(s);
          })();
          """

          async def main():
              browser = await uc.start(
                  browser_executable_path="/usr/bin/google-chrome",
                  headless=False, user_data_dir="/tmp/ts_dbg",
                  browser_args=["--disable-dev-shm-usage", "--mute-audio",
                                "--disk-cache-size=33554432"])
              page = await browser.get("https://clipcoin.pro/signin")
              await asyncio.sleep(3)
              print("PAGE:", await page.evaluate("""JSON.stringify({
                  title: document.title, url: location.href,
                  ready: document.readyState,
                  iframes: document.querySelectorAll('iframe').length,
                  bodyLen: document.body ? document.body.innerHTML.length : -1
              })"""), flush=True)
              await page.evaluate(INJECT)
              await asyncio.sleep(14)
              print("WIDGET:", await page.evaluate("""JSON.stringify({
                  turnstile: typeof window.turnstile,
                  apiLoaded: !!window._tsLoaded,
                  renderCalled: !!window._tsRenderCalled,
                  renderErr: window._tsRenderErr || null,
                  scriptErr: window._tsScriptErr || null,
                  token: window._tsToken || null,
                  err: window._tsError,
                  boxHTML: (document.getElementById('_ts_box')||{}).innerHTML ?
                      document.getElementById('_ts_box').innerHTML.slice(0,400) : 'NO-BOX',
                  iframesDoc: document.querySelectorAll('iframe').length,
                  shadow: !!window._tsShadowRoot,
                  shadowIframes: window._tsShadowRoot ?
                      window._tsShadowRoot.querySelectorAll('iframe').length : -1
              })"""), flush=True)
              # screenshot utk bukti visual (artifact dump via stdout path saja)
              await browser.stop()

          asyncio.run(main())
          EOF

      - name: Solve tests (LM + clipcoin REAL + CF demo)
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.request, urllib.error

          def solve(sitekey, siteurl, timeout=60):
              payload = json.dumps({"sitekey": sitekey, "siteurl": siteurl,
                                    "timeout": timeout}).encode()
              req = urllib.request.Request(
                  "http://127.0.0.1:8191/solve", data=payload,
                  headers={"Content-Type": "application/json"}, method="POST")
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=timeout + 30) as r:
                      d = json.loads(r.read())
              except urllib.error.HTTPError as e:
                  d = json.loads(e.read())
              return d, time.time() - t0

          lm_sk = os.environ.get("LM_SITEKEY", "").strip()
          tests = []
          if lm_sk:
              # target bot LM asli — kalau PASS, EzSolver layak masuk rantai
              tests.append(("lm", lm_sk, "https://lightningminer.com", 60))
          tests += [
              ("clipcoin", "0x4AAAAAAF2fs7K06aFo4dK_",
               "https://clipcoin.pro/signin", 45),
              # demo sitekey CF — info saja, bisa domain-locked
              ("cf-demo", "3x00000000000000000000FF",
               "https://www.cloudflare.com", 45),
          ]
          real_pass = False
          for name, sk, su, to in tests:
              try:
                  d, dt = solve(sk, su, timeout=to)
                  tok = str(d.get("token") or "")
                  ok = len(tok) > 20
                  if name in ("lm", "clipcoin"):
                      real_pass = real_pass or ok
                  print(f"[{name}] {'PASS' if ok else 'FAIL'} "
                        f"len={len(tok)} {dt:.1f}s "
                        f"{tok[:50] + '...' if ok else d}", flush=True)
              except Exception as e:
                  print(f"[{name}] ERROR {e}", flush=True)
          print("VERDICT:", "PASS — EzSolver solve sitekey bot ASLI"
                if real_pass else "FAIL — EzSolver tidak keluar token asli")
          raise SystemExit(0 if real_pass else 1)
          EOF
        env:
          LM_SITEKEY: ${{ steps.probe.outputs.lm_sitekey }}

      - name: Dump service log (full)
        if: always()
        run: cat /tmp/ezsolver-service.log
